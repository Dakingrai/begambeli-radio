<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Begambeli Radio — one signal, one schedule</title>
<meta name="description" content="A small internet radio station from begambeli.com. Everyone listening hears the same second of the same song.">
<meta name="theme-color" content="#e9ede3">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Begambeli Radio">
<meta property="og:title" content="Begambeli Radio">
<meta property="og:description" content="One signal, one schedule. Everyone here is hearing this same second.">
<meta property="og:url" content="https://radio.begambeli.com/">
<meta property="og:image" content="https://radio.begambeli.com/opengraph.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Begambeli Radio — a panda peeking out from behind the station's name.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e9ede3'/%3E%3Ccircle cx='9' cy='10' r='4' fill='%231a1f18'/%3E%3Ccircle cx='23' cy='10' r='4' fill='%231a1f18'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23fff' stroke='%231a1f18' stroke-width='2.5'/%3E%3Ccircle cx='12' cy='17' r='2' fill='%231a1f18'/%3E%3Ccircle cx='20' cy='17' r='2' fill='%231a1f18'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/fredoka-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/station.css">
<script type="module" src="assets/js/main.js"></script>
</head>

<body>

<!-- The page's own ground. Opaque, and painted over the player. -->
<div class="ground"></div>

<div class="scene">

  <!-- Sage wash, bamboo in the corner, and two petals on their way down. -->
  <div class="wash" aria-hidden="true"></div>
  <span class="bamboo bamboo--tall" aria-hidden="true"></span>
  <span class="bamboo bamboo--short" aria-hidden="true"></span>
  <span class="leaf leaf--a" aria-hidden="true"></span>
  <span class="leaf leaf--b" aria-hidden="true"></span>
  <span class="petal petal--a" aria-hidden="true"><span></span></span>
  <span class="petal petal--b" aria-hidden="true"><span></span></span>

  <header class="topbar">
    <span class="brand">
      <span class="logo" aria-hidden="true">
        <span class="logo__ear logo__ear--l"></span>
        <span class="logo__ear logo__ear--r"></span>
        <span class="logo__face"></span>
        <span class="logo__eye logo__eye--l"></span>
        <span class="logo__eye logo__eye--r"></span>
        <span class="logo__nose"></span>
        <span class="flower">
          <span class="flower__petal flower__petal--a"></span>
          <span class="flower__petal flower__petal--b"></span>
          <span class="flower__petal flower__petal--c"></span>
          <span class="flower__heart"></span>
        </span>
      </span>
      <span class="brand__name">Begambeli Radio</span>
    </span>

    <!-- The station, not your speakers: it is broadcasting whether or not
         anyone has pressed play. -->
    <span class="onair"><span class="onair__dot" aria-hidden="true"></span>On air</span>

    <a class="homelink" href="https://begambeli.com" target="_blank" rel="noopener">begambeli.com →</a>
  </header>

  <main class="hero">
    <div class="hero__mark">
      <span class="peekwindow" aria-hidden="true">
        <span class="panda">
          <span class="panda__ear panda__ear--l"></span>
          <span class="panda__ear panda__ear--r"></span>
          <span class="panda__face"></span>
          <span class="panda__eye panda__eye--l"></span>
          <span class="panda__eye panda__eye--r"></span>
          <span class="panda__pupil panda__pupil--l"></span>
          <span class="panda__pupil panda__pupil--r"></span>
          <span class="panda__paw panda__paw--l"></span>
          <span class="panda__paw panda__paw--r"></span>
        </span>
      </span>
      <h1 class="hero__title">Begambeli Radio</h1>
    </div>
    <p class="hero__sub">One signal on a fixed schedule. Everyone here is hearing this same second.</p>
    <p class="notice" id="notice" role="status" hidden></p>
  </main>

  <footer class="pill">
    <span class="disc" id="disc">
      <img class="disc__art" id="cover" src="" alt="" width="62" height="62">
      <span class="disc__spindle" aria-hidden="true"></span>
    </span>

    <div class="pill__mid">
      <div class="now" aria-live="polite">
        <h2 class="visually-hidden">On air</h2>
        <span class="now__title" id="title">&nbsp;</span>
        <span class="now__artist" id="artist">&nbsp;</span>
      </div>

      <div class="bar" id="rail" role="img" aria-label="Position in the broadcast loop."></div>

      <span class="clock"><span id="elapsed">0:00</span> / <span id="total">0:00</span></span>
    </div>

    <div class="pill__controls">
      <label class="vol">
        <span class="visually-hidden">Volume</span>
        <svg class="vol__icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        </svg>
        <input id="volume" type="range" min="0" max="100" step="1" value="70">
      </label>

      <button class="play" id="toggle" type="button" aria-pressed="false" aria-label="Play">
        <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z"/>
        </svg>
        <svg class="icon-pause" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>
        </svg>
      </button>
    </div>
  </footer>
</div>

<!-- Laid out at a real size and left running, but behind the opaque ground.
     Not display:none — browsers are entitled to refuse to start a player they
     consider unrendered, and some do. -->
<div class="stage" aria-hidden="true"><div id="player"></div></div>

</body>
</html>
