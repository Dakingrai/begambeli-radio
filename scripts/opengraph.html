<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/station.css">
<style>
  /* Imports the site's own stylesheet so this cannot drift from the real page.
     Only the frame size and the animation freezing are set here. */
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:var(--sky)}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;display:flex;flex-direction:column;
      background:var(--sky)}
  /* Hold every loop at a flattering frame. */
  .panda{animation:none;transform:translateY(10%)}
  .onair__dot::after{animation:none;opacity:.35;transform:scale(1.8)}
  .disc{animation:none}
  .og .topbar{padding:26px 34px;font-size:15px}
  .og .brand__name{font-size:15px}
  .og .homelink{font-size:15px}
  .og .switch{width:46px;padding:4px}
  .og .switch__knob{width:18px;height:18px;font-size:10px}
  .og .onair{font-size:15px;padding:7px 16px 7px 13px}
  .og .hero{gap:10px}
  .og .hero__title{font-size:78px}
  .og .hero__sub{font-size:17px}
  .og .pill{margin:0 34px 34px;max-width:700px;padding:13px 24px 13px 13px}
  .og .now__title{font-size:17px}
  .og .now__artist{font-size:13px}
  .og .clock{font-size:12px}
  .og .bar__fill{width:24%}
  .og .bar__thumb{left:24%}
  .og .disc__art{background:repeating-radial-gradient(circle at 50% 50%, #2a2f27 0 2px, #1f241d 2px 4px)}
</style></head>
<body>
<div class="og">
  <div class="sky">
    <span class="celestial"><span class="crater crater--a"></span><span class="crater crater--b"></span></span>
    <span class="cloud cloud--a" style="animation:none"><span class="cloud__bar"><i></i><i></i></span></span>
    <span class="cloud cloud--b" style="animation:none"><span class="cloud__bar"><i></i></span></span>
    <span class="peak peak--l1"></span><span class="peak peak--l2"></span><span class="peak peak--l3"></span>
    <span class="peak peak--r1"></span><span class="peak peak--r2"></span><span class="peak peak--r3"></span>
    <div class="mist"></div>
    <span class="bamboo bamboo--tall"></span>
    <span class="bamboo bamboo--short"></span>
    <span class="leaf leaf--a"></span>
    <span class="leaf leaf--b"></span>
    <span class="petal petal--a" style="animation:none;top:150px;left:42%"><span style="animation:none"></span></span>
    <span class="petal petal--b" style="animation:none;top:210px;left:66%"><span style="animation:none"></span></span>
  </div>

  <header class="topbar">
    <span class="brand">
      <span class="logo">
        <span class="logo__ear logo__ear--l"></span><span class="logo__ear logo__ear--r"></span>
        <span class="logo__face"></span>
        <span class="logo__eye logo__eye--l"></span><span class="logo__eye logo__eye--r"></span>
        <span class="logo__nose"></span>
        <span class="flower">
          <span class="flower__petal flower__petal--a"></span>
          <span class="flower__petal flower__petal--b"></span>
          <span class="flower__petal flower__petal--c"></span>
          <span class="flower__heart"></span>
        </span>
      </span>
      <span class="brand__name">Begambeli Radio</span>
    </span>
    <span class="onair"><span class="onair__dot"></span>On air</span>
    <span class="topbar__end"><span class="switch"><span class="switch__knob"></span></span><span class="homelink">begambeli.com →</span></span>
  </header>

  <main class="hero">
    <div class="hero__mark">
      <span class="peekwindow">
        <span class="panda">
          <span class="panda__ear panda__ear--l"></span><span class="panda__ear panda__ear--r"></span>
          <span class="panda__face"></span>
          <span class="panda__eye panda__eye--l"></span><span class="panda__eye panda__eye--r"></span>
          <span class="panda__pupil panda__pupil--l"></span><span class="panda__pupil panda__pupil--r"></span>
          <span class="panda__paw panda__paw--l"></span><span class="panda__paw panda__paw--r"></span>
        </span>
      </span>
      <h1 class="hero__title">Begambeli Radio</h1>
    </div>
    <p class="hero__sub">One signal on a fixed schedule. Everyone here is hearing this same second.</p>
  </main>

  <footer class="pill">
    <span class="disc">
      <span class="disc__art" style="display:block;width:100%;height:100%;border-radius:50%"></span>
      <span class="disc__spindle"></span>
    </span>
    <div class="pill__mid">
      <div class="now">
        <span class="now__title">Yo Samjhine Mann Chha</span>
        <span class="now__artist">Narayan Gopal</span>
      </div>
      <div class="bar"><span class="bar__fill"></span><span class="bar__thumb"></span></div>
      <span class="clock">9:54 / 41:16</span>
    </div>
    <div class="pill__controls">
      <span class="play">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      </span>
    </div>
  </footer>
</div>
</body></html>
